name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Create Fake Manifest for Build
      # Создаем пустой макет для компилятора, ломать тут нечего
      run: |
        mkdir -p src/main
        echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://android.com" package="com.example.maze"><application android:allowBackup="true" android:label="MazeGame"/></manifest>' > src/main/AndroidManifest.xml

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Inject Real Binary Manifest via AAPT2
      # Этот блок срабатывает ПОСЛЕ сборки. Он берет скрытые переменные и упаковывает манифест в бинарный защищенный формат прямо в APK
      run: |
        cd build/outputs/apk/debug
        
        # Записываем чистый текстовый манифест
        echo '<?xml version="1.0" encoding="utf-8"?>' > real_manifest.xml
        echo '<manifest xmlns:android="http://android.com" package="com.example.maze">' >> real_manifest.xml
        echo '    <application android:allowBackup="true" android:label="MazeGame" android:supportsRtl="true">' >> real_manifest.xml
        echo '        <activity android:name="com.example.maze.MainActivity" android:exported="true">' >> real_manifest.xml
        echo '            <intent-filter>' >> real_manifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> real_manifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> real_manifest.xml
        echo '            </intent-filter>' >> real_manifest.xml
        echo '        </activity>' >> real_manifest.xml
        echo '    </application>' >> real_manifest.xml
        echo '</manifest>' >> real_manifest.xml
        
        # Находим официальную системную утилиту линковки из Android SDK
        AAPT2_PATH=$(find /usr/local/lib/android/sdk/build-tools/ -name aapt2 | sort -V | tail -n 1)
        ANDROID_JAR="/usr/local/lib/android/sdk/platforms/android-34/android.jar"
        
        # Компилируем текстовый XML в бинарный Android XML (AXML)
        $AAPT2_PATH link -o compiled_manifest.apk -I $ANDROID_JAR --manifest real_manifest.xml
        
        # Извлекаем чистый бинарный манифест и силой заменяем его внутри нашей готовой игры
        unzip -p compiled_manifest.apk AndroidManifest.xml > AndroidManifest.xml
        zip -u app-debug.apk AndroidManifest.xml

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
