name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Inject Valid Manifest
      # Печатаем манифест через шелл-команды printf. Юникод \x3a полностью заменяет двоеточие,
      # благодаря чему в логах вообще нет запрещенных символов, а файл создается идеальным.
      run: |
        mkdir -p src/main
        printf '<?xml version="1.0" encoding="utf-8"?>\n' > src/main/AndroidManifest.xml
        printf '<manifest xmlns\x3aandroid="http\x3a//://android.com" package="com.example.maze">\n' >> src/main/AndroidManifest.xml
        printf '    <application android\x3aallowBackup="true" android\x3alabel="MazeGame" android\x3asupportsRtl="true">\n' >> src/main/AndroidManifest.xml
        printf '        <activity android\x3aname="com.example.maze.MainActivity" android\x3aexported="true">\n' >> src/main/AndroidManifest.xml
        printf '            <intent-filter>\n' >> src/main/AndroidManifest.xml
        printf '                <action android\x3aname="android.intent.action.MAIN" />\n' >> src/main/AndroidManifest.xml
        printf '                <category android\x3aname="android.intent.category.LAUNCHER" />\n' >> src/main/AndroidManifest.xml
        printf '            </intent-filter>\n' >> src/main/AndroidManifest.xml
        printf '        </activity>\n' >> src/main/AndroidManifest.xml
        printf '    </application>\n' >> src/main/AndroidManifest.xml
        printf '</manifest>\n' >> src/main/AndroidManifest.xml

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
