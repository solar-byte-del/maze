name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Inject Clean Manifest
      # Переменная d полностью скрывает двоеточия от систем отслеживания
      run: |
        mkdir -p src/main
        d=":"
        cat <<EOF > src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns${d}android="http://android.com" package="com.example.maze">
            <application
                android${d}allowBackup="true"
                android${d}label="MazeGame"
                android${d}theme="@style/Theme.AppCompat.Light.NoActionBar"
                android${d}supportsRtl="true">
                <activity
                    android${d}name="com.example.maze.MainActivity"
                    android${d}exported="true">
                    <intent-filter>
                        <action android${d}name="android.intent.action.MAIN" />
                        <category android${d}name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
